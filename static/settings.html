<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'" />
    <title>Desktop Pet settings</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <header>
      <h1>Desktop Pet</h1>
      <span id="status" class="status" aria-live="polite"></span>
    </header>

    <section>
      <h2>Pet</h2>
      <div class="pets" id="pets" role="group" aria-label="Choose your pet"></div>
      <label class="row" for="catScale">
        <span>Size</span>
        <span class="value" id="catScaleLabel"></span>
      </label>
      <input type="range" id="catScale" step="1" />
      <div class="scale-ends"><span>small</span><span>big</span></div>
    </section>

    <section>
      <h2>Reminders</h2>
      <div class="row">
        <label class="toggle"><input type="checkbox" id="breakReminders" /><span>Stretch break every</span></label>
        <span class="minutes"><input type="number" id="breakMinutes" /> min</span>
      </div>
      <div class="row">
        <label class="toggle"><input type="checkbox" id="waterReminders" /><span>Water every</span></label>
        <span class="minutes"><input type="number" id="waterMinutes" /> min</span>
      </div>
      <div class="row">
        <label class="toggle"><input type="checkbox" id="lateNightNudges" /><span>Bedtime nudges (1–5 AM)</span></label>
      </div>
      <p class="hint">Only time you're actively using the PC counts.</p>
    </section>

    <section>
      <h2>Startup</h2>
      <div class="row">
        <label class="toggle"><input type="checkbox" id="startWithWindows" /><span>Start with Windows</span></label>
      </div>
    </section>

    <section>
      <h2>Watched git repos <span class="count" id="repoCount"></span></h2>
      <ul id="repos" class="repos"></ul>
      <div class="buttons">
        <button id="addRepos">Add repo or folder…</button>
        <button id="rescanRepos" class="secondary">Look in usual folders</button>
      </div>
      <p class="hint">Commits and pushes in these repos make your pet celebrate. Read-only; nothing leaves your PC.</p>
    </section>

    <script type="module" src="../dist/settings/settings.js"></script>
  </body>
</html>
